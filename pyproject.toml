[build-system]
requires = ["setuptools>=77", "wheel"]   # >=77 for the SPDX `license = "MIT"` string
build-backend = "setuptools.build_meta"

[project]
name = "sign-bridge"
version = "0.17.0"
description = "Bidirectional ASL + PSL sign language translator: sign-to-speech and speech-to-sign."
readme = "README.md"
requires-python = ">=3.11,<3.13"   # TensorFlow 2.16 ships no 3.13 wheels
license = "MIT"
authors = [{ name = "SignBridge contributors" }]
keywords = ["sign-language", "ASL", "PSL", "accessibility", "mediapipe", "lstm"]

dependencies = [
    "numpy>=1.26,<2.0",            # pinned <2 for TF/MediaPipe ABI compatibility
    "pandas>=2.1",
    "opencv-python>=4.9",
    "mediapipe==0.10.14",           # later builds dropped mp.solutions.holistic
    "tensorflow>=2.15,<2.17",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "streamlit>=1.50",              # width="stretch", st.video autoplay
    "starlette<1",                  # Starlette 1.x breaks Streamlit media: images/audio/video return HTTP 500
    "openai-whisper>=20231117",
    "gTTS>=2.5",
    "pyttsx3>=2.90",
    "moviepy>=1.0.3,<2.0",         # pinned <2: v2 renamed the editor API
    "sounddevice>=0.4.6",          # mic capture (portaudio backend, pip-installable)
    "soundfile>=0.12",
    "pydantic>=2.6",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-PyYAML",
]

[project.scripts]
sign-bridge  = "sign_bridge.main:run_app"
sign-collect = "sign_bridge.data.collector:main"
sign-train   = "sign_bridge.models.trainer:main"
sign-eval    = "sign_bridge.models.evaluator:main"
sign-import  = "sign_bridge.data.importer:main"
sign-import-aslcitizen = "sign_bridge.data.asl_citizen:main"
sign-check-aslcitizen = "sign_bridge.data.asl_citizen_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sign_bridge = ["py.typed", "ui/*.html", "ui/vendor/*.js", "ui/vendor/*.txt", "ui/avatar/*",
               "ui/static/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
disallow_subclassing_any = false  # Keras Layer is untyped (Any); we subclass it
# C-extension / untyped third-party libraries
[[tool.mypy.overrides]]
module = [
    "cv2.*", "mediapipe.*", "tensorflow.*", "keras.*", "whisper.*",
    "gtts.*", "pyttsx3.*", "moviepy.*", "sounddevice.*", "soundfile.*",
    "sklearn.*", "joblib.*", "matplotlib.*", "streamlit.*", "pandas.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]  # allow typing.Any in **kwargs passthroughs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]   # lets tests import tests.conftest with plain `pytest`
